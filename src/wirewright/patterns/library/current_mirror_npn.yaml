name: current_mirror_npn
version: 1
description: NPN current mirror (two NPNs, shared base, one diode-connected)
priority: 200
match:
  components:
    - {role: q_ref, symbol: npn}
    - {role: q_out, symbol: npn}
  topology:
    - q_ref.B == q_out.B
    - q_ref.B == q_ref.C
    - q_ref.C != q_out.C
placement:
  q_ref: {dx: 0,   dy: 0, orientation: R0}
  q_out: {dx: 192, dy: 0, orientation: R0}
