[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wirewright"
version = "0.2.0.dev0"
description = "Auto-generate readable LTspice .asc schematics from SPICE netlists"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gert Drapers" }]
keywords = ["ltspice", "spice", "schematic", "placer", "eda", "eurorack"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "typer >=0.12,<1.0",
    "pydantic >=2.7,<3.0",
    "networkx >=3.3,<4.0",
    "rich >=13.0,<15.0",
    "pyyaml >=6.0,<7.0",
    "hola-graph>=0.1.5",
]

[project.optional-dependencies]
hola = ["hola-graph >=0.1.5"]  # ARM64 PyPI wheel; pyhola was renamed
dev = [
    "pytest >=8.0",
    "pytest-cov >=5.0",
    "ruff >=0.6",
    "mypy >=1.10",
    "hypothesis >=6.100",
    "pre-commit >=3.7",
]

[project.scripts]
wirewright = "wirewright.cli:app"

[project.urls]
Homepage = "https://github.com/gertd/wirewright"
Issues = "https://github.com/gertd/wirewright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wirewright"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests requiring fixtures",
    "requires_elk: tests that need the Node.js elk-bridge installed",
    "requires_hola: tests that need pyhola built and installed",
]
